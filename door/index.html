<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Door · 6FEET Deep</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--panel:#0e0e0e;--line:#262626;--text:#fff;--muted:#a3a3a3;--dim:#6b6b6b;--orange:#ea5a0c;--red:#e3161b;--ok:#1f9d55;--warn:#d98a00}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top b{font-size:15px}.top b span{color:var(--red)}
.count{font-size:13px;color:var(--muted)}.count b{color:var(--text);font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#cfcfcf;margin:14px 0 7px}
input,select{width:100%;height:50px;padding:0 14px;border-radius:9px;border:1px solid #333;background:#000;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--orange)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:10px;background:var(--orange);color:#000;font-weight:800;font-size:16px;cursor:pointer;margin-top:16px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid #444}
.err{color:#ff6b6b;font-size:14px;margin-top:10px;min-height:1em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;border-radius:9px;height:42px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:#222;color:var(--text)}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#111;aspect-ratio:3/4}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;color:#ddd}
.manual{display:flex;gap:8px;margin-top:12px}
.manual input{flex:1;text-transform:uppercase;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace}
.manual button{flex:none;width:96px;margin:0;min-height:50px}
.result{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer}
.result.show{display:flex}
.result .big{font-size:64px;font-weight:900;line-height:1}
.result .name{font-size:30px;font-weight:800;margin-top:18px;word-break:break-word}
.result .sub{font-size:17px;margin-top:10px;opacity:.9}
.result .over{margin-top:26px;border:2px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer}
.result .tap{position:absolute;bottom:28px;font-size:13px;opacity:.75}
.result.ok{background:var(--ok)}.result.warn{background:var(--warn);color:#000}.result.bad{background:var(--red)}
.search{position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .n{font-weight:700}.row .m{font-size:12px;color:var(--muted);margin-top:2px}
.row button{flex:none;border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--orange);color:#000}
.row button.in{background:#143d25;color:#7ee2a8}
.row.wl .n,.row.rel .n{color:var(--muted)}.row.rel .n{text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:22px;line-height:1.1}.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats .g b{color:#7ee2a8}.stats .a b{color:var(--warn)}.stats .r b{color:#ff6b6b}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
.tag.c{background:#143d25;color:#7ee2a8}.tag.x{background:#3d1414;color:#ff8a8a}.tag.w{background:#333;color:#ccc}.tag.ns{background:#3d2a00;color:#ffb84d}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b><span>6FEET</span> DEEP · Door</b><span class="count" id="count"></span></div>

  <!-- login -->
  <div class="card" id="login">
    <label for="ev">Event</label>
    <select id="ev">
      <option value="001-viridity">001 · Viridity · Sat 17 Oct</option>
      <option value="002-k65">002 · K-65 · Fri 30 Oct</option>
    </select>
    <label for="pin">Door PIN</label>
    <input id="pin" type="password" autocomplete="off" autocapitalize="characters" placeholder="8 characters">
    <button class="btn" id="go">Open door list</button>
    <p class="err" id="lerr"></p>
  </div>

  <!-- app -->
  <div id="app" class="hide">
    <div class="stats" id="stats"></div>
    <div class="tabs"><button id="tScan" class="on">Scan</button><button id="tList">Guest list</button></div>
    <div id="pScan">
      <div class="cam"><video id="vid" playsinline muted></video><div class="frame"></div><div class="hint" id="camHint">Point at the QR code</div></div>
      <div class="manual"><input id="code" placeholder="Or type code" maxlength="14"><button class="btn" id="codeGo">Check</button></div>
    </div>
    <div id="pList" class="hide">
      <div class="search"><input id="q" placeholder="Search name or last 3 of mobile"></div>
      <div id="rows"></div>
    </div>
    <button class="btn ghost" id="out">Switch event / log out</button>
  </div>
</div>
<div class="result" id="res"><div class="big" id="rBig"></div><div class="name" id="rName"></div><div class="sub" id="rSub"></div><button class="over hide" id="rOver" type="button">Let in now</button><div class="tap">Tap to scan next</div></div>

<script src="../assets/js/jsQR.min.js"></script>
<script>
const SB = "https://tgmpgjvvtyhtodltvhbz.supabase.co", KEY = "sb_publishable_-qU9zP_R-s1a6FX_X3PZRw_MGcFVBRK";
const $ = id => document.getElementById(id);
let S = { slug:null, pin:null, rows:[], busy:false, stream:null, raf:0 };
async function rpc(fn, body){
  const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, { method:"POST", headers:{ apikey:KEY, "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if(!r.ok) throw new Error(`${fn} ${r.status}: ${await r.text()}`);
  return r.json();
}
function ss(k, v){ try{ if(v === undefined) return sessionStorage.getItem(k); if(v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){} }

async function login(slug, pin){
  $("lerr").textContent = ""; $("go").disabled = true; $("go").textContent = "Checking...";
  try{
    const d = await rpc("door_list", { p_slug:slug, p_pin:pin });
    if(d.result !== "ok"){ $("lerr").textContent = "Wrong PIN for that event."; return; }
    S.slug = slug; S.pin = pin; S.rows = d.rows; S.past = d.past; ss("door_slug", slug); ss("door_pin", pin);
    $("login").classList.add("hide"); $("app").classList.remove("hide");
    renderRows(); startCam();
  }catch(e){ console.error("[door] login", e); $("lerr").textContent = "Couldn't reach the guest list. Check signal and try again."; }
  finally{ $("go").disabled = false; $("go").textContent = "Open door list"; }
}
$("go").onclick = () => login($("ev").value, $("pin").value.trim().toUpperCase());
$("out").onclick = () => { ss("door_pin", null); stopCam(); location.reload(); };

async function refresh(){
  if(!S.slug) return;
  try{ const d = await rpc("door_list", { p_slug:S.slug, p_pin:S.pin }); if(d.result === "ok"){ S.rows = d.rows; S.past = d.past; renderRows(); } }
  catch(e){ console.error("[door] refresh", e); }
}
setInterval(refresh, 20000);

function renderRows(){
  const saved = S.rows.filter(r => r.status === "saved"), inN = saved.filter(r => r.in).length;
  $("count").innerHTML = `<b>${inN}</b> in / ${saved.length} on list`;
  const conf = saved.filter(r => r.confirmed || r.in).length, rel = S.rows.filter(r => r.released && r.status === "cancelled").length, wl = S.rows.filter(r => r.status === "waitlist").length;
  // before the night: who's confirmed / not replied; after: who didn't show
  $("stats").innerHTML = S.past
    ? `<div class="g"><b>${inN}</b><span>Came</span></div><div class="a"><b>${saved.length - inN}</b><span>No-show</span></div><div class="r"><b>${rel}</b><span>Released</span></div><div><b>${wl}</b><span>Waitlist</span></div>`
    : `<div class="g"><b>${conf}</b><span>Confirmed</span></div><div class="a"><b>${saved.length - conf}</b><span>No reply</span></div><div class="r"><b>${rel}</b><span>Released</span></div><div><b>${wl}</b><span>Waitlist</span></div>`;
  const q = $("q").value.trim().toLowerCase();
  const list = S.rows.filter(r => !q || r.name.toLowerCase().includes(q) || (r.phone_end||"").endsWith(q));
  $("rows").innerHTML = list.map(r => {
    const t = r.in ? new Date(r.in).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "";
    const tag = r.status === "cancelled" ? '<span class="tag x">Released</span>' : r.status === "waitlist" ? '<span class="tag w">Waitlist</span>'
      : (S.past && !r.in) ? '<span class="tag ns">No-show</span>' : (r.confirmed && !r.in) ? '<span class="tag c">Confirmed</span>' : "";
    const meta = [r.phone_end ? "…" + r.phone_end : "", r.ref ? "via " + r.ref : ""].filter(Boolean).join(" · ");
    const btn = r.status !== "saved" ? "" : r.in ? `<button class="in" data-undo="${r.code}">In ${t}</button>` : `<button data-code="${r.code}">Check in</button>`;
    return `<div class="row ${r.status === "waitlist" ? "wl" : r.status === "cancelled" ? "rel" : ""}"><div><div class="n">${esc(r.name)}${tag}</div><div class="m">${esc(meta)}</div></div>${btn}</div>`;
  }).join("") || `<p style="color:var(--muted);padding:16px 0">No one matches.</p>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
$("q").oninput = renderRows;
$("rows").onclick = async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.code) await check(b.dataset.code);
  else if(b.dataset.undo && confirmUndo(b)) { await rpc("door_check_in", { p_slug:S.slug, p_pin:S.pin, p_code:b.dataset.undo, p_undo:true }); refresh(); }
};
function confirmUndo(b){ if(b.dataset.armed){ return true; } b.dataset.armed = 1; b.textContent = "Tap again to undo"; setTimeout(() => { delete b.dataset.armed; renderRows(); }, 2500); return false; }

$("tScan").onclick = () => { $("tScan").classList.add("on"); $("tList").classList.remove("on"); $("pScan").classList.remove("hide"); $("pList").classList.add("hide"); startCam(); };
$("tList").onclick = () => { $("tList").classList.add("on"); $("tScan").classList.remove("on"); $("pList").classList.remove("hide"); $("pScan").classList.add("hide"); stopCam(); refresh(); };

/* ---- result screen ---- */
function show(kind, big, name, sub){
  const r = $("res"); r.className = "result show " + kind;
  $("rOver").classList.add("hide");
  $("rBig").textContent = big; $("rName").textContent = name || ""; $("rSub").textContent = sub || "";
  try{ navigator.vibrate && navigator.vibrate(kind === "ok" ? 120 : [200,100,200]); }catch(e){}
}
$("res").onclick = () => { $("res").className = "result"; S.busy = false; };

// Filming from 18:00 (London time): late arrivals may have to wait for a set change
const LAST_ENTRY = { "001-viridity":"2026-10-17T18:00:00+01:00", "002-k65":"2026-10-30T18:00:00+00:00" };
async function check(raw, override){
  if(S.busy && !override) return; S.busy = true;
  const le = LAST_ENTRY[S.slug] && new Date(LAST_ENTRY[S.slug]).getTime();
  if(!override && le && Date.now() > le && Date.now() < le + 6*36e5){
    show("warn", "HOLD · FILMING", "", "Late arrival. Cameras are rolling: hold them until the set change, then let in.");
    const o = $("rOver"); o.classList.remove("hide");
    o.onclick = ev => { ev.stopPropagation(); o.classList.add("hide"); check(raw, true); };
    return;
  }
  try{
    const d = await rpc("door_check_in", { p_slug:S.slug, p_pin:S.pin, p_code:raw, p_undo:false });
    const t = d.checked_in_at ? new Date(d.checked_in_at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "";
    if(d.result === "ok") show("ok", "IN", d.name, "Check photo ID matches · 18+");
    else if(d.result === "already") show("warn", "ALREADY IN", d.name, `Scanned at ${t}`);
    else if(d.result === "wrong_event") show("bad", "WRONG NIGHT", d.name, `Ticket is for ${d.event}`);
    else if(d.result === "not_saved") show("bad", d.status === "cancelled" ? "RELEASED" : "NO SPOT", d.name, d.status === "waitlist" ? "On the waitlist, not the list" : d.status === "cancelled" ? "They released this ticket. QR no longer valid" : "Early list only, not a spot");
    else if(d.result === "bad_pin") { show("bad", "PIN EXPIRED", "", "Log in again"); ss("door_pin", null); }
    else show("bad", "NOT FOUND", "", "Check the code or search the guest list");
    refresh();
  }catch(e){ console.error("[door] check", e); show("bad", "NO SIGNAL", "", "Couldn't reach the list. Try again or use the guest list."); }
}
$("codeGo").onclick = () => { const c = $("code").value.replace(/\s/g,"").toUpperCase(); if(c){ $("code").value = ""; check(c); } };

/* ---- camera ---- */
const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently:true });
async function startCam(){
  if(S.stream) return;
  try{
    S.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} }, audio:false });
    const v = $("vid"); v.srcObject = S.stream; await v.play(); $("camHint").textContent = "Point at the QR code"; tick();
  }catch(e){ console.error("[door] camera", e); $("camHint").textContent = "Camera blocked. Allow camera access, or type the code below."; }
}
function stopCam(){ cancelAnimationFrame(S.raf); if(S.stream){ S.stream.getTracks().forEach(t => t.stop()); S.stream = null; } }
let last = "", lastAt = 0;
function tick(){
  S.raf = requestAnimationFrame(tick);
  const v = $("vid"); if(S.busy || v.readyState < 2) return;
  const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth) || 360;
  cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
  const q = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:"dontInvert" });
  if(q && q.data){
    const now = Date.now(); if(q.data === last && now - lastAt < 4000) return;
    last = q.data; lastAt = now; check(q.data);
  }
}

/* ---- resume session ---- */
(() => { const s = ss("door_slug"), p = ss("door_pin"); if(s) $("ev").value = s; if(s && p) login(s, p); })();
</script>
</body>
</html>
